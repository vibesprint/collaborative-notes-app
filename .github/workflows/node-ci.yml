name: GitHub Actions Hello World

# 1. Define the trigger event
on:
  push:
    branches: [ "main" ]

# 2. Group the tasks together
jobs:
  build-and-test:
    # Specify the operating system server environment
    runs-on: ubuntu-latest

    # 3. List individual tasks sequentially
    steps:
      - name: Checkout the repo code
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install packages
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: dist/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: 'Download artifact'
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: dist/

      - name: Deploy to server
        run: |
          echo "TODO: Deploy the production build"
